# CastFlow web 映像：gcloud builds submit --config cloudbuild.yaml --substitutions=_SUPABASE_URL=...,_SUPABASE_ANON_KEY=...,_IMAGE=REGION-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_REPOSITORY/web
# NEXT_PUBLIC_* 建置時內嵌進前端，所以用 build arg 傳入（anon key 本來就會出現在前端）
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - -t
      - ${_IMAGE}:${SHORT_SHA}
      - -t
      - ${_IMAGE}:latest
      - .
images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest
substitutions:
  _IMAGE: REGION-docker.pkg.dev/YOUR_GCP_PROJECT/YOUR_REPOSITORY/web
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
