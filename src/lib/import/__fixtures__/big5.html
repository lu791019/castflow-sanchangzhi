<!doctype html><html><head><meta http-equiv="Content-Type" content="text/html; charset=big5"><title>樹大招風</title></head><body><div class="article"><p>樹大招風拍的是三個大賊的故事，但其實是在講一個時代的結束。九七之前的香港，每個人都在等，等一個不知道會不會來的未來。</p><p>三個賊沒有見過面，卻被同一個時代困住。電影最後那場戲，讓我在戲院裡坐了很久才站起來。</p><p>時代把人推著走，誰都以為自己是那個最大的賊。</p></div></body></html>
