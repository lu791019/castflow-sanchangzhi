<h3 class="post-title">人聲：聽見自己的聲音</h3>
<p>這部片從頭到尾只有一個人在說話，卻比任何群戲都熱鬧。導演讓我們只聽見聲音，於是每一個停頓都變得很重。</p>
<p>我想起小時候躲在棉被裡聽廣播，那個聲音陪我度過很多個睡不著的夜晚。原來聲音可以這麼近，近到像是有人坐在床邊。</p>
<p>散場之後我在捷運上打開手機錄音，想聽聽看自己的聲音，結果只錄到車廂裡的廣播。</p>
